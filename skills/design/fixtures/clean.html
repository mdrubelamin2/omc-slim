<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No seeded defects</title>
<style>
  :root { --ink: #16181d; --muted: #4a5058; --line: rgba(20, 22, 28, 0.12); }
  * { box-sizing: border-box; }
  body {
    font-family: sans-serif;
    margin: 0;
    padding: 24px;
    background: #ffffff;
    color: var(--ink);
    font-size: 17px;
    line-height: 1.55;
    max-width: 66ch;
  }
  h1 { font-size: 34px; line-height: 1.1; letter-spacing: -0.02em; margin: 0 0 8px; }
  h2 { font-size: 22px; line-height: 1.25; margin: 32px 0 8px; }
  p { color: var(--muted); margin: 0 0 16px; }
  .action {
    display: inline-flex;
    align-items: center;
    min-height: 40px;
    padding: 8px 16px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #f4f5f7;
    color: var(--ink);
    font-size: 16px;
    transition: background-color 160ms cubic-bezier(0.23, 1, 0.32, 1);
  }
  .action:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  @media (hover: hover) and (pointer: fine) {
    .action:hover { background: #e8eaee; }
  }
  .panel { border-radius: 20px; background: #f7f8fa; padding: 20px; margin: 16px 0; }
  .chip { border-radius: 999px; background: #eceef2; padding: 4px 10px; display: inline-block; font-size: 14px; }
  label { display: block; font-size: 15px; margin-bottom: 4px; }
  input { font-size: 16px; min-height: 40px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; width: 100%; }
  figure { margin: 0 0 16px; }
  svg { display: block; border-radius: 12px; }
</style>
</head>
<body>
  <h1>A page with nothing seeded in it</h1>
  <p>Body copy sitting inside a bounded measure, above the twelve pixel floor, at a contrast the gate accepts.</p>

  <figure>
    <svg width="320" height="120" viewBox="0 0 320 120" role="img" aria-label="A plain placeholder">
      <rect width="320" height="120" fill="#dfe3ea"></rect>
    </svg>
  </figure>

  <h2>A heading that skips no level</h2>
  <p>More copy, again inside the measure, again above the floor.</p>

  <div class="panel">
    <label for="email">Email address</label>
    <input id="email" type="email" name="email" autocomplete="email" inputmode="email" spellcheck="false">
  </div>

  <p><span class="chip">A chip</span></p>

  <p><a class="action" href="#somewhere">A link sized past the target floor</a></p>
  <p><button class="action" type="button">A button sized past the target floor</button></p>
</body>
</html>
